name: Offline tests
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify implementation present
        run: |
          test -s dealhunter.py
          test -s community_hunter.py
          test -s catalog_discovery.py
          test -s requirements.txt
          test -f tests/test_community_hunter.py
          test -f tests/test_dealhunter.py
          test -f tests/test_discovery.py
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run all offline tests
        run: python -m unittest discover -s tests -v
